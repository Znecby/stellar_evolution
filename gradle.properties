# 指定本地已安装的 JDK，避免工具链自动下载（中文用户名用 \uXXXX 转义，防止被按 Latin-1 读取乱码）
# JDK 25 用于编译与 NeoForm 运行时（MC 26.1.2 / NeoForge 26.1.2 要求 Java 25），JDK 21 备用
org.gradle.java.installations.paths=C:/Users/\u5927\u7231\u4ed9\u5c0a/.jdks/ms-21.0.11,C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot
# 让 Gradle 守护进程运行在 JDK 25 上（与编译工具链一致，避免 fork Worker Daemon 失败）
org.gradle.java.home=C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot
