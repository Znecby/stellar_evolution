modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
    modId="stellar_evolution"
    version="${version}"
    displayName="恒星演变"
    logoFile="icon.png"
    description='''工业科技向：热压差能源网络、2×2×2 大机器、固定多方块与储罐 / 管道，涵盖生化 / 石化 / 煤化工 / 空分 / 裂变 / 聚变 / 高能物理 / 选冶 / 基岩 / 月球、装备与质量投射轨道炮等产线。
无硬前置；JEI / Jade / GuideME 为可选联动。当前版本仍在开发中。'''
    authors="ModMind"

[[dependencies.stellar_evolution]]
    modId="neoforge"
    type="required"
    versionRange="[26.1.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.stellar_evolution]]
    modId="minecraft"
    type="required"
    versionRange="[26.1,)"
    ordering="NONE"
    side="BOTH"

# 手册是可选的：未安装 GuideME 时模组照常运行，只是不注册/打开手册。
[[dependencies.stellar_evolution]]
    modId="guideme"
    type="optional"
    versionRange="[26.1.17-beta,)"
    ordering="NONE"
    side="CLIENT"

[[mixins]]
    config = "stellar_evolution.mixins.json"